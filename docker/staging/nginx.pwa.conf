# Static PWA SPA baked into the pwa image (apps/pwa/dist), served under /app/.
# Vite base is /app/, so index.html references /app/assets/...
server {
    listen 80;
    server_name _;

    # Compression (PERF-4).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript application/manifest+json text/css text/plain image/svg+xml;

    # Security headers (SEC-L2/INF-4). The PWA is a standalone app — never framed.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /app { return 301 /app/; }

    # Service worker: must NOT be long-cached — a stale SW pins users to an old
    # shell. no-cache forces revalidation on every check.
    location = /app/sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /app/manifest.webmanifest {
        alias /usr/share/nginx/html/manifest.webmanifest;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri /app/index.html;
    }
}
